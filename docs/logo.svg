<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Loco">
  <title>Loco</title>
  <defs>
    <linearGradient id="locoHex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57e6ff"/>
      <stop offset="55%" stop-color="#6ea8ff"/>
      <stop offset="100%" stop-color="#3b62c4"/>
    </linearGradient>
    <linearGradient id="locoCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ff0ff"/>
      <stop offset="100%" stop-color="#3f7bff"/>
    </linearGradient>
    <filter id="locoGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer hex shell: the lab boundary -->
  <path d="M64 8 L114 36 V92 L64 120 L14 92 V36 Z"
        fill="none" stroke="url(#locoHex)" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- inner ring: the router -->
  <circle cx="64" cy="64" r="21" fill="none" stroke="url(#locoCore)" stroke-width="3" opacity="0.95"/>

  <!-- the served brain -->
  <circle cx="84" cy="64" r="8.5" fill="#3ddc97" opacity="0.92" filter="url(#locoGlow)"/>

  <!-- the route: apps -> gate -> brain -->
  <path d="M46 64 H76" stroke="#8ab4f8" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>

  <!-- the data pulse -->
  <circle cx="46" cy="64" r="4" fill="#57e6ff" opacity="0.9"/>
</svg>
